name: Deploy Astro to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CONTACT_ENDPOINT_URL: ${{ secrets.PUBLIC_CONTACT_ENDPOINT_URL }}
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy with lftp without deleting server files
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
        run: |
          REMOTE_DIR="${FTP_REMOTE_DIR:-.}"
          lftp -c "
          set ftp:ssl-allow no;
          set net:max-retries 2;
          set net:timeout 20;
          set xfer:clobber on;
          open -u $FTP_USER,$FTP_PASS $FTP_HOST;
          mirror -R --verbose dist/ ${REMOTE_DIR};
          bye
          "
